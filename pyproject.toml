[tool.ruff]
target-version = "py314"
line-length = 100
include = ["main.py", "ml/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These names are retained as public imports for existing callers and checkpoints.
"ml/utils/preprocess.py" = ["F401"]
